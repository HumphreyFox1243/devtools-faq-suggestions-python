[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtools-faq-suggestions"
version = "0.1.0"
description = "Suggest build, release, and diagnostic FAQ entries while developers type."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/devtools_faq"]

